{% extends 'base.html' %}{% block content %}<div class="form-card panel"><h1>Edit Inventory</h1><form method="post"><label>Item Name</label><input name="item_name" value="{{ item.item_name }}" required><label>Category</label><input name="category" value="{{ item.category }}" required><label>Quantity</label><input type="number" name="quantity" min="0" value="{{ item.quantity }}" required><label>Unit Price</label><input type="number" name="unit_price" step="0.01" min="0" value="{{ item.unit_price }}" required><button class="gradient-btn">Save Changes</button></form></div>{% endblock %}
